<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="tourbar" hidden></div>

  <aside id="left" class="panel">
    <header class="brand">
      <div class="logo" role="img" aria-label="Code City" title="Code City"><i></i><i></i><i></i></div>
      <div class="brandtext">
        <div class="name">Code City</div>
        <button id="repo" class="sub repobtn" type="button" title="switch branch" disabled>no repository</button>
      </div>
      <button id="flowbtn" class="icon walkbtn" type="button" title="flow diagram: how the code runs (D)">FLOW</button>
      <button id="walk" class="icon walkbtn" type="button" title="walk the city as a player (G)">WALK</button>
      <button id="hacker" class="icon mono" type="button" title="hacker mode (H)">&gt;_</button>
      <button id="theme" class="icon" type="button" title="toggle day / night (T)">☾</button>
    </header>

    <div id="branchpop" hidden></div>
    <details id="repobox" open>
      <summary>Repository</summary>
      <form id="repoform">
        <textarea id="source" rows="2" placeholder="local path or git URL&#10;one repo per line (optional ref after a space)" autocomplete="off" spellcheck="false" required></textarea>
        <div id="branches"></div>
        <div class="row">
          <span class="lbl">history samples</span>
          <input id="commits" type="number" min="1" max="1000" value="100" title="history samples (1 = snapshot only)" />
        </div>
        <label class="chk" title="change frequency, coupling and ownership from git log (needs a full clone)"><input id="churn" type="checkbox" checked /> history analysis (churn, coupling, owners)</label>
        <div class="row">
          <button id="go" type="submit" class="primary">Analyze</button>
          <button id="cancel" type="button" hidden>Cancel</button>
        </div>
        <div id="progress" hidden><div id="bar"></div></div>
        <div id="jobstatus"></div>
      </form>
    </details>

    <div id="stats" class="stats"></div>
    <button id="tourbtn" class="tourbtn" type="button" title="a guided route through the codebase: docs, entry points, core modules, hotspots (U)">▶ Guided tour <span>U</span></button>

    <section class="controls">
      <label>Color
        <select id="color">
          <option value="language">language</option>
          <option value="hotspot">hotspots (churn × complexity)</option>
          <option value="churn">churn (change frequency)</option>
          <option value="complexity">complexity</option>
          <option value="age">code age (last change)</option>
          <option value="owner">owner</option>
          <option value="knowledge">knowledge risk</option>
          <option value="compare">compare to baseline</option>
          <option value="dependents">dependents (fan-in)</option>
        <option value="depth">directory depth</option>
        </select>
      </label>
      <label id="cwinrow">Window
        <select id="cwin">
          <option value="0">all history so far</option>
          <option value="5">last 5 samples</option>
          <option value="10">last 10 samples</option>
          <option value="25">last 25 samples</option>
        </select>
      </label>
      <label>Code links
        <select id="codelinks" title="imports between files, drawn as circuit traces (L)">
          <option value="selection">selected file</option>
          <option value="all">whole city</option>
          <option value="off">off</option>
        </select>
      </label>
      <label>Buildings
        <select id="buildings" title="architecture: shape, facade and roof come from each file's code (B)">
          <option value="arch">architecture</option>
          <option value="classic">classic boxes</option>
        </select>
      </label>
      <div id="connrow" class="row connrow" hidden>
        <span>Links</span>
        <label class="chk" title="dependencies declared in manifests or imported in code"><input id="showdeps" type="checkbox" checked /> dependencies</label>
        <label class="chk" title="contributors who committed to both repositories"><input id="showpeople" type="checkbox" /> shared people</label>
      </div>
      <div id="baserow" class="row baserow" hidden>
        <span id="basedate"></span>
        <button id="setbase" type="button" title="use the current commit as the baseline (or shift-click the timeline)">set to current</button>
      </div>
      <label>Height
        <select id="metric">
          <option value="loc">lines of code</option>
          <option value="complexity">complexity</option>
          <option value="lines">total lines</option>
          <option value="bytes">bytes</option>
        </select>
      </label>
      <label>Scale
        <div class="row">
          <select id="scale">
            <option value="sqrt">sqrt</option>
            <option value="linear">linear</option>
            <option value="log">log</option>
          </select>
          <input id="mult" type="range" min="0.2" max="3" step="0.05" value="1" title="height multiplier" />
        </div>
      </label>
    </section>

    <div class="searchbox">
      <input id="search" type="search" placeholder="search files…  ( / )" autocomplete="off" spellcheck="false" />
      <div id="results"></div>
    </div>

    <div id="legend"></div>
    <details id="archlegend"><summary>How buildings are built</summary><div id="archbody"></div></details>
  </aside>

  <aside id="right">
    <div id="info" class="panel" hidden></div>
    <section id="insights" class="panel" hidden>
      <div class="tabs" role="tablist">
        <button data-tab="hotspots" class="on">Hotspots</button>
        <button data-tab="coupling">Coupling</button>
        <button data-tab="risk">Risk</button>
        <button data-tab="complex">Complex</button>
        <button data-tab="areas">Areas</button>
        <button data-tab="deps">Deps</button>
        <button data-tab="authors">People</button>
        <button data-tab="links" hidden>Links</button>
      </div>
      <div id="tabhelp" class="help"></div>
      <div id="tabbody"></div>
      <footer><button id="copyreport" type="button">Copy report as Markdown</button><span id="copied"></span></footer>
    </section>
  </aside>

  <div id="timeline" class="panel" hidden>
    <button id="play" type="button" title="play / pause (space)">▶</button>
    <div class="chartwrap">
      <canvas id="chart"></canvas>
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="commit" />
    </div>
    <div class="tlside">
      <select id="speed" title="commits per second">
        <option value="1">1/s</option><option value="3" selected>3/s</option><option value="8">8/s</option><option value="20">20/s</option>
      </select>
      <label class="chk" title="tint files added / changed in this commit"><input id="changes" type="checkbox" checked /> changes</label>
    </div>
    <div id="when"></div>
  </div>

  <section id="code" class="panel" hidden></section>

  <div id="tip" hidden></div>
  <div id="msg"></div>
  <div id="keys" class="help">drag: orbit · right-drag: pan · scroll: zoom · click: inspect · dbl-click: zoom in · E: explode file · G: walk · H: hacker mode · F: overview · Esc: back</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
