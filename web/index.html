<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code City</title>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="title">Code City <span id="repo"></span></div>
    <form id="repoform">
      <input id="source" type="text" placeholder="repo path or git URL" autocomplete="off" spellcheck="false" required />
      <div class="row">
        <input id="ref" type="text" placeholder="ref (HEAD)" autocomplete="off" spellcheck="false" />
        <input id="commits" type="number" min="1" max="1000" value="100" title="history samples (1 = snapshot only)" />
      </div>
      <label class="chk" title="analyze change frequency from git log (needs a full clone)"><input id="churn" type="checkbox" checked /> churn &amp; hotspots</label>
      <div class="row">
        <button id="go" type="submit">Analyze</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </div>
      <div id="jobstatus"></div>
    </form>
    <div id="stats"></div>
    <label>Height
      <select id="metric">
        <option value="loc">lines of code</option>
        <option value="lines">total lines</option>
        <option value="bytes">bytes</option>
      </select>
    </label>
    <label>Scale
      <select id="scale">
        <option value="sqrt">sqrt</option>
        <option value="linear">linear</option>
        <option value="log">log</option>
      </select>
    </label>
    <label>Height ×
      <input id="mult" type="range" min="0.2" max="3" step="0.05" value="1" />
    </label>
    <label>Color
      <select id="color">
        <option value="language">language</option>
        <option value="size">size</option>
        <option value="depth">depth</option>
        <option value="churn">churn</option>
        <option value="hotspot">hotspot</option>
      </select>
    </label>
    <label id="cwinrow">Churn over
      <select id="cwin">
        <option value="0">all time</option>
        <option value="5">last 5 samples</option>
        <option value="10">last 10 samples</option>
        <option value="25">last 25 samples</option>
      </select>
    </label>
    <div id="hotspots" hidden></div>
    <input id="search" type="search" placeholder="search files…" autocomplete="off" />
    <div id="legend"></div>
  </div>

  <div id="timeline" hidden>
    <button id="play" type="button" title="play / pause (space)">▶</button>
    <input id="scrub" type="range" min="0" max="0" step="1" value="0" />
    <select id="speed" title="commits per second">
      <option value="1">1/s</option><option value="3" selected>3/s</option><option value="8">8/s</option><option value="20">20/s</option>
    </select>
    <label class="chk"><input id="changes" type="checkbox" checked /> changes</label>
    <div id="when"></div>
  </div>

  <div id="tip" hidden></div>
  <div id="info" hidden></div>
  <div id="msg"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
